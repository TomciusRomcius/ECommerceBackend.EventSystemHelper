name: Build and publish NuGet package
on:
  push:
    branches: [development, ci/cd]

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Pack NuGet package
        run: dotnet pack --configuration Release -o ./nupkgs
      - name: Push package to NuGet
        run: |
          dotnet nuget push ./nupkgs/*.nupkg \
          --api-key ${{ secrets.NUGET_API_KEY }} \
      - name: Add GitHub NuGet source
        run: |
          dotnet nuget add source \
          --name github \
          --username ${{ github.actor }} \
          --password ${{ secrets.GH_TOKEN }} \
          --store-password-in-clear-text \
          "https://nuget.pkg.github.com/TomciusRomcius/index.json"

      - name: Push to Github packages
        run: dotnet nuget push ./nupkgs/*.nupkg --source "github" --skip-duplicate --api-key ${{ secrets.GH_TOKEN }}
